[project]
name = "coa-sources"
version = "0.1.0"
description = "Unified Sources for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    "python-ulid>=3.0.0",
    "coa-common",
    "coa-control-plane-server",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_sources"]

[dependency-groups]
integ = [
    "requests>=2.34.2",
    "pytest-xdist>=3.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]
pythonpath = ["."]

[tool.uv.sources]
coa-common = { workspace = true }
coa-control-plane-server = { workspace = true }
